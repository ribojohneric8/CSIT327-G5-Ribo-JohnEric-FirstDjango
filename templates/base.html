<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CampusConnect{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, Helvetica, sans-serif;
            color: #103f30;
            background: #f5faf7;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px 16px;
        }

        .site-shell {
            width: min(100%, 960px);
            margin: 0 auto;
            overflow: hidden;
            background: #fff;
            border: 1px solid #cfe7dc;
            border-radius: 8px;
            box-shadow: 0 3px 12px rgb(16 63 48 / 10%);
        }

        .site-nav {
            min-height: 56px;
            padding: 0 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            color: #fff;
            background: #0c3f2d;
            font-size: 14px;
        }

        .site-brand {
            color: #fff;
            font-weight: 700;
            text-decoration: none;
        }

        .nav-account {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-account form {
            margin: 0;
        }

        .nav-account a {
            color: #fff;
        }

        .site-nav a:not(.site-brand),
        .nav-logout {
            color: #fff;
        }

        .nav-logout {
            padding: 0;
            border: 0;
            background: none;
            font: inherit;
            cursor: pointer;
        }

        .page-content {
            min-height: 320px;
            padding: 32px 36px 40px;
        }

        .message-stack {
            margin-bottom: 20px;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px 8px;
            }

            .site-nav {
                padding: 0 14px;
                gap: 8px;
            }

            .page-content {
                min-height: 260px;
                padding: 22px 18px 28px;
            }
        }
    </style>
</head>
<body>
<div class="site-shell">
    <nav class="site-nav">
        <a class="site-brand" href="{% url 'dashboard' %}">CampusConnect</a>
        {% if user.is_authenticated %}
            <div class="nav-account flex-wrap justify-content-end">
                <span>Hi, {{ user.first_name|default:user.username }}</span>
                <a class="btn btn-sm btn-outline-light" href="{% url 'profile' %}">Edit Profile</a>
                <span aria-hidden="true">|</span>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button class="nav-logout" type="submit">Log out</button>
                </form>
            </div>
        {% else %}
            <div class="nav-account">
                <a href="{% url 'login' %}">Log in</a>
                <a href="{% url 'signup' %}">Sign up</a>
            </div>
        {% endif %}
    </nav>
    <main class="page-content">
        {% if messages %}
            <div class="message-stack" aria-live="polite">
                {% for message in messages %}
                    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
